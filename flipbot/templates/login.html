<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip Bot — Log in</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1b18;--line:#e2ddd1;--gold:#b8860b;--bad:#a8322a}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--card:#1f1e1b;--ink:#f1ede4;--line:#34322d;--gold:#e0b03c;--bad:#f0837a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:22px;margin:0 0 16px}h1 span{color:var(--gold)}
input,button{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
input{background:var(--bg);color:var(--ink);margin-bottom:12px}
button{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600;cursor:pointer}
.error{color:var(--bad);margin:0 0 12px}
</style>
</head>
<body>
<form method="post">
  <h1>Flip <span>Bot</span></h1>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<p class="error">{{ msg }}</p>{% endfor %}
  <input name="password" type="password" placeholder="Password" aria-label="Password" autofocus required>
  <button>Log in</button>
</form>
</body>
</html>
