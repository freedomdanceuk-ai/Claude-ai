<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AdLab{% endblock %}</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1f;--mute:#6b6b75;--line:#e4e2dc;--accent:#d99a00;--accent-ink:#1b1b1f;
--good:#1f8a4c;--ok:#c08400;--bad:#c2410c;--chip:#f0eee8}
@media (prefers-color-scheme:dark){:root{--bg:#141417;--card:#1e1e23;--ink:#ececf1;--mute:#a0a0ab;--line:#2e2e35;
--chip:#2a2a31;--accent:#f5b700}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
header a{color:inherit;text-decoration:none}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}.logo span{color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.hint{color:var(--mute);font-size:13px;font-weight:400}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500;background:var(--chip);padding:6px 10px;border-radius:999px;margin:0;cursor:pointer}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;
font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn.secondary{background:var(--chip);color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center}
.score{font-size:56px;font-weight:800;line-height:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip)}
.high{color:var(--bad)}.medium{color:var(--ok)}.low{color:var(--mute)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
.frames{display:flex;gap:8px;overflow-x:auto}.frames img{height:150px;border-radius:8px}
.outs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.outs figure{margin:0}.outs img,.outs video{width:100%;border-radius:10px;background:#000}
.outs figcaption{font-size:13px;margin-top:4px}
pre.cap{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:10px;font:inherit;margin:0}
.loading{display:none}.busy .loading{display:inline}.busy .idle{display:none}
ul{padding-left:20px;margin:6px 0}
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}" class="logo">Ad<span>Lab</span></a><span class="hint">Analyse · improve · reformat your adverts</span></header>
<main>{% block body %}{% endblock %}</main>
<script>
document.querySelectorAll('form[data-busy]').forEach(f=>f.addEventListener('submit',()=>{f.classList.add('busy');
f.querySelectorAll('button').forEach(b=>b.disabled=true)}));
</script>
</body>
</html>
